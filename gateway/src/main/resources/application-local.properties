############################
# SERVER
############################
server.port=8090


############################
# DATABASE / JPA
############################
spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${JPA_DB_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/stitch}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:1234}

spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.generate-ddl=${GENERATE_DDL:true}


############################
# JWT SECURITY
############################
security.token.access.secret-key=${ACCESS_TOKEN_SECRET:2023BillantedChangeAccessKey}
security.token.access.expiry-length=${ACCESS_TOKEN_EXPIRY:180000000}

security.token.refresh.secret-key=${REFRESH_TOKEN_SECRET:2023BillantedChangeRefreshKey}
security.token.refresh.expiry-length=${REFRESH_TOKEN_EXPIRY:43200000}


############################
# CORS CONFIGURATION
############################
cors.allowed-credential=${CORS_ALLOW:true}
cors.allowed-origins=${CORS_ORIGIN:http://localhost:3001}
cors.allowed-headers=${CORS_HEADERS:Origin, X-Requested-With, Content-Type, Accept, Authorization}
cors.allowed-methods=${CORS_METHODS:GET, POST, PUT, DELETE, OPTIONS}

